box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2ee;--card:#fff;--line:#d5ddd8;--tx:#13201a;--mut:#5d6e68;--g:#1f8a43;--btn:#1f8a43;--btx:#fff}}

:root[data-theme="light"]{--bg:#eef2ee;--card:#fff;--line:#d5ddd8;--tx:#13201a;--mut:#5d6e68;--g:#1f8a43;--btn:#1f8a43;--btx:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.4 Barlow,system-ui,sans-serif;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}

h1{font-size:30px;font-weight:600;margin-bottom:12px;letter-spacing:.2px}h2{font-size:21px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px}
.mut{color:var(--mut);font-size:13px}.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.score{font-size:44px;font-weight:600;letter-spacing:1px}
.tl{display:grid;grid-template-columns:1fr 44px 1fr;gap:0 4px;align-items:center}

.L{text-align:right}.min{background:var(--blue);color:#fff;border-radius:99px;text-align:center;font:700 15px 'Barlow Condensed',sans-serif;padding:2px 0}
table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--mut);font-weight:500;font-size:13px}
td:nth-child(2),th:nth-child(2){text-align:left}td:first-child{width:30px;color:var(--mut)}tr:last-child td{border:0}.big{font:700 20px 'Barlow Condensed',sans-serif}
.crown{color:var(--gold);font-size:18px}

button{cursor:pointer}.pri{background:var(--btn);color:var(--btx);border:0;font-weight:500;width:100%}

.f{display:grid;gap:8px;min-width:0}.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.f>*,.g2>*{min-width:0;max-width:100%}input,select{width:100%;min-width:0;max-width:100%}input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;text-align:left}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);min-height:50px;font-size:12px}nav button.on{color:var(--g);font-weight:600;box-shadow:inset 0 2px 0 var(--g)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;display:none;width:max-content;max-width:90%}
.cap{padding:14px;background:var(--bg)}input[type=file]{display:block;margin-top:6px;width:100%}
.kit{display:inline-block;width:11px;height:16px;border-radius:3px;margin-right:7px;vertical-align:-2px}

.row input{width:auto;flex:1}
.ev i{font-style:normal;font-size:11px}.ev .si{color:var(--g)}.ev .so{color:#e5534b}.min.sb{background:#6b7b78}
.poster{margin:0 -10px;--tx:#eef2f2;--mut:#8b9a98;--line:#232d33;background:#0f1417;color:#eef2f2;border-radius:14px;overflow:hidden}
.ph{padding:18px 10px 16px;text-align:center;background:linear-gradient(90deg,rgba(238,106,60,.30),#0a0f11 32%,#0a0f11 68%,rgba(232,211,176,.30))}
.pt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#aab6b4;margin-bottom:10px}

.tn{font:700 20px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.02em}

.ps{font-size:40px;font-weight:700;line-height:1;margin-top:2px}
.pbody{margin:6px 4px;background:#161d21;border-radius:12px;padding:10px 4px}
